extends: [spectral:oas]
rules:
  operation-operationId: error

  no-content-on-204:
    description: HTTP 204 responses must not declare a body.
    severity: error
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace].responses['204']"
    then:
      field: content
      function: undefined

  book-year-integer:
    description: Book.year must match the integer type in the Python model.
    severity: error
    given: $.components.schemas.Book.properties.year
    then:
      field: type
      function: enumeration
      functionOptions:
        values: [integer]

  response-200-has-fields:
    description: JSON 200 responses must define at least one object field (or item field for arrays).
    severity: error
    resolved: true
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace].responses['200']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: object
              required: [application/json]
              properties:
                application/json:
                  type: object
                  required: [schema]
                  properties:
                    schema:
                      type: object
                      required: [type]
                      anyOf:
                        - properties:
                            type: {const: object}
                            properties: {type: object, minProperties: 1}
                          required: [properties]
                        - properties:
                            type: {const: array}
                            items:
                              type: object
                              required: [type, properties]
                              properties:
                                type: {const: object}
                                properties: {type: object, minProperties: 1}
                          required: [items]
