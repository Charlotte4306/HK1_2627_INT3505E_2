x-api-common: &api-common
  build: .
  environment:
    DB_URL: postgresql+psycopg://app:devpw@db:5432/appdb

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api-common
    command:
      - python
      - -m
      - flask
      - --app
      - wsgi:app
      - db
      - upgrade
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-common
    ports:
      - "5000:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: