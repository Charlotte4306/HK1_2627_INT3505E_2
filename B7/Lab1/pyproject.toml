[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "1.0.0"
description = "Lab 1 - Product CRUD API"
requires-python = ">=3.10"

dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<2.1",
    "flask-smorest>=0.47,<0.48",
    "marshmallow>=4,<5",
    "Flask-Migrate>=4,<5",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]