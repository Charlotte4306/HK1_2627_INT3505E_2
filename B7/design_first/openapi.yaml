openapi: 3.0.3
info:
  title: Product API - Design First
  version: 1.0.0
paths:
  /products:
    get:
      operationId: products.list_products
      summary: Lấy danh sách sản phẩm
      responses:
        '200':
          description: Danh sách sản phẩm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      operationId: products.create_product
      summary: Tạo sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '201':
          description: Đã tạo sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Dữ liệu không hợp lệ
        '409':
          description: SKU đã tồn tại
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
components:
  schemas:
    ProductIn:
      type: object
      additionalProperties: false
      required: [sku, name, price_cents]
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          example: DEMO-001
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          example: Keyboard
        price_cents:
          type: integer
          minimum: 0
          example: 15000
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, price_cents]
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        price_cents:
          type: integer
