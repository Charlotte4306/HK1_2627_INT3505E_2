openapi: 3.0.3

info:
  title: Social Network API
  version: 1.0.0
  description: |
    API mạng xã hội sử dụng JWT để xác thực
    và scope để phân quyền truy cập.

servers:
  - url: https://api.example.com

tags:
  - name: Authentication
  - name: Posts

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      description: |
        Endpoint công khai, không yêu cầu scope.
        Xác thực email và mật khẩu để cấp token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email hoặc mật khẩu không đúng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Làm mới access token
      description: |
        Không yêu cầu access scope.
        Bắt buộc có refresh token hợp lệ,
        chưa hết hạn và chưa bị thu hồi.
        Refresh token không được dùng để
        gọi các API tài nguyên.
      security:
        - refreshBearer: []
      responses:
        "200":
          description: Cấp access token mới
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
        "401":
          description: |
            Refresh token thiếu, sai, hết hạn
            hoặc đã bị thu hồi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Lấy thông tin bài viết
      description: |
        Cần access token có scope posts:read.
        Bài viết công khai được phép truy cập.
        Bài viết riêng tư chỉ cho phép chủ sở hữu
        hoặc người có quyền tương ứng truy cập.
      security:
        - accessBearer: []
      x-required-scopes:
        - posts:read
      parameters:
        - name: id
          in: path
          required: true
          description: ID của bài viết
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lấy bài viết thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Thiếu hoặc sai access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Thiếu scope posts:read hoặc không
            có quyền xem bài viết.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Bài viết không tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    accessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT có scope posts:read

    refreshBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Chỉ chấp nhận refresh JWT

  schemas:
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900

    Post:
      type: object
      required: [id, author_id, content, visibility]
      properties:
        id:
          type: integer
          example: 101
        author_id:
          type: integer
          example: 42
        content:
          type: string
          example: Hello Social Network!
        visibility:
          type: string
          enum: [public, private]
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: unauthorized
        message:
          type: string
          example: Authentication failed

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Gửi quá nhiều yêu cầu
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ServerError:
      description: Lỗi hệ thống
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
